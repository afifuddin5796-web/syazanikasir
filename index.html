<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Syazani Kasir</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192x192.png">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #38bdf8;
      --good: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
    header { text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 20px; color: var(--accent); }
    header p { font-size: 12px; color: var(--sub); }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .card h3 { font-size: 15px; margin-bottom: 10px; color: var(--accent); display: flex; justify-content: space-between; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 13px; margin-top: 4px; margin-bottom: 8px; }
    button { background: var(--accent); color: #0f172a; font-weight: bold; border: none; cursor: pointer; }
    button.btn-danger { background: var(--danger); color: #fff; }
    
    .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0f172a; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
    .product-info h4 { font-size: 14px; }
    .product-info p { font-size: 12px; color: var(--sub); }
    .btn-add { width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
    
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .cart-qty { display: flex; gap: 6px; align-items: center; }
    .cart-qty button { width: 24px; height: 24px; padding: 0; line-height: 24px; margin: 0; border-radius: 4px; }
    
    .total-box { font-size: 16px; font-weight: bold; text-align: right; margin: 10px 0; color: var(--good); }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Syazani Kasir</h1>
    <p>Sistem Kasir & Pencatatan Penjualan</p>
  </header>

  <!-- FORM PRODUK -->
  <div class="card">
    <h3>Tambah / Edit Produk</h3>
    <input type="text" id="pNama" placeholder="Nama Barang / Produk">
    <div class="grid">
      <input type="number" id="pHarga" placeholder="Harga (Rp)" inputmode="numeric">
      <input type="number" id="pStok" placeholder="Stok" inputmode="numeric">
    </div>
    <button onclick="simpanProduk()">+ Tambah Produk</button>
  </div>

  <!-- DAFTAR PRODUK -->
  <div class="card">
    <h3>Daftar Produk</h3>
    <div id="listProduk"></div>
  </div>

  <!-- KERANJANG BELANJA -->
  <div class="card">
    <h3>Keranjang Belanja</h3>
    <div id="listKeranjang"></div>
    <div class="total-box" id="totalBayar">Total: Rp0</div>
    <div class="grid">
      <input type="number" id="bayarNominal" placeholder="Uang Dibayar (Rp)" inputmode="numeric" oninput="hitungKembalian()">
      <div style="font-size:13px; padding-top:12px;" id="kembalianText">Kembali: Rp0</div>
    </div>
    <button style="background:var(--good);" onclick="prosesTransaksi()">Selesaikan Transaksi & Cetak</button>
  </div>

  <!-- RIWAYAT PENJUALAN -->
  <div class="card">
    <h3>Riwayat Penjualan</h3>
    <div id="listRiwayat"></div>
  </div>

  <script>
    const STORAGE_KEY = 'syazani_kasir_db';
    
    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      produk: [],
      keranjang: [],
      riwayat: []
    };

    function formatRp(n) {
      return 'Rp' + (Number(n) || 0).toLocaleString('id-ID');
    }

    function saveDB() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      renderAll();
    }

    /* PRODUK */
    function simpanProduk() {
      const nama = document.getElementById('pNama').value.trim();
      const harga = Number(document.getElementById('pHarga').value) || 0;
      const stok = Number(document.getElementById('pStok').value) || 0;

      if(!nama || harga <= 0) {
        alert('Isi nama produk dan harga dengan benar.');
        return;
      }

      db.produk.push({ id: Date.now(), nama, harga, stok });
      document.getElementById('pNama').value = '';
      document.getElementById('pHarga').value = '';
      document.getElementById('pStok').value = '';
      saveDB();
    }

    function hapusProduk(id) {
      if(confirm('Hapus produk ini?')) {
        db.produk = db.produk.filter(p => p.id !== id);
        saveDB();
      }
    }

    /* KERANJANG */
    function tambahKeKeranjang(id) {
      const prod = db.produk.find(p => p.id === id);
      if(!prod) return;

      const item = db.keranjang.find(k => k.id === id);
      if(item) {
        item.qty += 1;
      } else {
        db.keranjang.push({ id: prod.id, nama: prod.nama, harga: prod.harga, qty: 1 });
      }
      saveDB();
    }

    function ubahQty(id, delta) {
      const item = db.keranjang.find(k => k.id === id);
      if(!item) return;

      item.qty += delta;
      if(item.qty <= 0) {
        db.keranjang = db.keranjang.filter(k => k.id !== id);
      }
      saveDB();
    }

    function hitungKembalian() {
      const total = db.keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bayar = Number(document.getElementById('bayarNominal').value) || 0;
      const kembali = bayar - total;
      document.getElementById('kembalianText').textContent = 'Kembali: ' + formatRp(kembali > 0 ? kembali : 0);
    }

    /* TRANSAKSI */
    function prosesTransaksi() {
      if(db.keranjang.length === 0) {
        alert('Keranjang masih kosong.');
        return;
      }

      const total = db.keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bayar = Number(document.getElementById('bayarNominal').value) || 0;

      if(bayar < total) {
        alert('Uang pembayaran kurang!');
        return;
      }

      const transaksi = {
        id: Date.now(),
        tanggal: new Date().toLocaleString('id-ID'),
        items: [...db.keranjang],
        total: total,
        bayar: bayar,
        kembali: bayar - total
      };

      db.riwayat.unshift(transaksi);
      db.keranjang = [];
      document.getElementById('bayarNominal').value = '';
      saveDB();

      alert('Transaksi berhasil disimpan!');
    }

    function hapusRiwayat(id) {
      if(confirm('Hapus riwayat transaksi ini?')) {
        db.riwayat = db.riwayat.filter(r => r.id !== id);
        saveDB();
      }
    }

    /* RENDER */
    function renderAll() {
      // Render Produk
      const elProduk = document.getElementById('listProduk');
      elProduk.innerHTML = db.produk.length === 0 ? '<p style="color:var(--sub);font-size:12px;">Belum ada produk.</p>' : '';
      db.produk.forEach(p => {
        elProduk.innerHTML += `
          <div class="product-item">
            <div class="product-info">
              <h4>${p.nama}</h4>
              <p>${formatRp(p.harga)} | Stok: ${p.stok}</p>
            </div>
            <div>
              <button class="btn-add" onclick="tambahKeKeranjang(${p.id})">+ Pilih</button>
              <span style="color:var(--danger);margin-left:8px;cursor:pointer;font-size:12px;" onclick="hapusProduk(${p.id})">✕</span>
            </div>
          </div>
        `;
      });

      // Render Keranjang
      const elKeranjang = document.getElementById('listKeranjang');
      elKeranjang.innerHTML = db.keranjang.length === 0 ? '<p style="color:var(--sub);font-size:12px;">Keranjang kosong.</p>' : '';
      let total = 0;
      db.keranjang.forEach(k => {
        const subtotal = k.harga * k.qty;
        total += subtotal;
        elKeranjang.innerHTML += `
          <div class="cart-item">
            <div>
              <b>${k.nama}</b><br>
              <small>${formatRp(k.harga)} x ${k.qty} = ${formatRp(subtotal)}</small>
            </div>
            <div class="cart-qty">
              <button onclick="ubahQty(${k.id}, -1)">-</button>
              <span>${k.qty}</span>
              <button onclick="ubahQty(${k.id}, 1)">+</button>
            </div>
          </div>
        `;
      });
      document.getElementById('totalBayar').textContent = 'Total: ' + formatRp(total);
      hitungKembalian();

      // Render Riwayat
      const elRiwayat = document.getElementById('listRiwayat');
      elRiwayat.innerHTML = db.riwayat.length === 0 ? '<p style="color:var(--sub);font-size:12px;">Belum ada riwayat transaksi.</p>' : '';
      db.riwayat.slice(0, 10).forEach(r => {
        elRiwayat.innerHTML += `
          <div style="border-bottom:1px solid var(--border); padding:8px 0; font-size:12px;">
            <div style="display:flex;justify-content:space-between;color:var(--sub);">
              <span>${r.tanggal}</span>
              <span style="color:var(--danger);cursor:pointer;" onclick="hapusRiwayat(${r.id})">Hapus</span>
            </div>
            <div style="font-size:14px;font-weight:bold;color:var(--good);margin-top:2px;">
              Total: ${formatRp(r.total)}
            </div>
          </div>
        `;
      });
    }

    // Load pertama
    renderAll();

    // Register Service Worker untuk Offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Syazani Kasir Service Worker terdaftar:', reg))
          .catch(err => console.error('Gagal registrasi Service Worker:', err));
      });
    }
  </script>
</body>
</html>
