<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyazaniKasir</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SyazaniKasir">
    
    <!-- External CSS & Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold text-xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide text-white">SyazaniKasir</h1>
            </div>
            <div id="connectionStatus" class="flex items-center space-x-2 text-xs bg-slate-700 px-3 py-1 rounded-full text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Offline Ready</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Panel: Scanner & Catalog / Forms -->
        <section class="lg:col-span-2 space-y-6">
            
            <!-- Quick Action / Scanner Box -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-barcode text-amber-400"></i> Scan & Input Produk
                </h2>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="barcodeInput" placeholder="Scan Barcode / Ketik Nama Barang..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
                    <button id="startScanBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-camera"></i> Kamera
                    </button>
                </div>
                <!-- Camera Preview Container -->
                <div id="reader" class="mt-4 hidden rounded-lg overflow-hidden border border-slate-700"></div>
            </div>

            <!-- Product Management / Quick Select -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-amber-400"></i> Daftar Produk
                    </h2>
                    <button id="openAddProductModal" class="bg-slate-700 hover:bg-slate-600 text-xs text-amber-400 border border-amber-500/30 font-semibold px-3 py-1.5 rounded-lg">
                        + Tambah Produk
                    </button>
                </div>
                <div id="productList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-[400px] overflow-y-auto pr-1">
                    <!-- Dynamic Product Cards will load here -->
                </div>
            </div>

        </section>

        <!-- Right Panel: Cart & Checkout -->
        <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-amber-400"></i> Keranjang Belanja
                </h2>

                <!-- Cart Items List -->
                <div id="cartItems" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                    <p class="text-slate-500 text-sm text-center py-8">Keranjang masih kosong</p>
                </div>
            </div>

            <!-- Total & Action Buttons -->
            <div class="mt-6 pt-4 border-t border-slate-700 space-y-4">
                <div class="flex justify-between items-center text-slate-400 text-sm">
                    <span>Subtotal</span>
                    <span id="subtotalText" class="font-medium text-white">Rp 0</span>
                </div>
                <div class="flex justify-between items-center text-lg font-bold text-white">
                    <span>Total</span>
                    <span id="totalText" class="text-amber-400 text-2xl">Rp 0</span>
                </div>

                <button id="checkoutBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded-lg shadow-lg transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-cash-register"></i> Bayar Sekarang
                </button>
            </div>
        </section>

    </main>

    <!-- Add Product Modal -->
    <div id="addProductModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-5 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-white">Tambah Produk</h3>
                <button id="closeAddProductModal" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="addProductForm" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Nama Produk</label>
                    <input type="text" id="productNameInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Harga</label>
                        <input type="number" id="productPriceInput" required min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Stok</label>
                        <input type="number" id="productStockInput" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Barcode (opsional)</label>
                    <input type="text" id="productBarcodeInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-lg mt-2">
                    Simpan Produk
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-3 text-xs text-slate-500">
        &copy; 2026 SyazaniKasir - Offline Pro POS
    </footer>

    <!-- Service Worker Script Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }
    </script>
    <script src="ms.js"></script>
</body>
</html>
